<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b3d8c">
<title>Teknologi Modern — SMPN 2 Randuagung</title>
<style>
/* ==========================================================
   SMPN 2 RANDUAGUNG — My Digital World
   Satu halaman panjang: scroll vertikal alami dari atas ke bawah.
   Tidak ada overflow:hidden pada halaman utama, tidak ada touch
   handler yang memblokir gulir, dan tidak ada navigasi geser samping.
   ========================================================== */

:root {
  --ink: #14233d;
  --muted: #56667f;
  --blue: #2f6bff;
  --blue-2: #1a8fff;
  --cyan: #2ed4ff;
  --deep: #0b3d8c;
  --navy: #061a45;
  --white: #ffffff;
  --card: rgba(255, 255, 255, 0.88);
  --line: rgba(20, 50, 100, 0.08);
  --radius: 26px;
  --radius-sm: 16px;
  --ease: cubic-bezier(0.22, 0.75, 0.2, 1);
  --shadow-soft: 0 12px 34px rgba(18, 55, 110, 0.12), 0 2px 6px rgba(18, 55, 110, 0.05);
  --shadow-panel: 0 18px 50px rgba(18, 55, 110, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: border-box; }

html {
  background: #8ec4e4;
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  line-height: 1.6;
  background: transparent;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

/* Latar foto langit (tetap di belakang, tidak menangkap sentuhan) */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background-image:
    linear-gradient(180deg, rgba(9, 48, 91, 0.08), rgba(12, 62, 108, 0.18)),
    url("https://ganga--link--ghhzdp9sv8hk.code.run/i/eho68pjo");
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 0%, rgba(46, 212, 255, 0.14), transparent 55%);
}

[hidden] { display: none !important; }
img { max-width: 100%; display: block; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; border-radius: 10px; }

/* ================= INTRO (versi 5: lebih hidup, konsep tetap) ================= */
body.is-intro { overflow: hidden; height: 100%; }

#intro {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: calc(24px + var(--safe-t)) 20px calc(28px + var(--safe-b));
  color: #fff;
  background: radial-gradient(ellipse at 50% 12%, #3d92f2 0%, #1452b8 36%, #082060 74%, #040f2c 100%);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  overflow: hidden;
  transition: opacity 0.6s ease, visibility 0.6s ease, transform 0.75s var(--ease), filter 0.6s ease;
}
#intro.is-leaving { opacity: 0; visibility: hidden; pointer-events: none; transform: scale(1.04); filter: blur(6px); }
#intro:focus { outline: none; }

/* Latar: cahaya bergerak perlahan + grid digital */
.intro-aurora { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.intro-aurora i {
  position: absolute;
  border-radius: 50%;
  filter: blur(64px);
  opacity: 0.5;
  animation: drift 16s ease-in-out infinite alternate;
}
.intro-aurora i:nth-child(1) { width: 62vmax; height: 62vmax; left: -22vmax; top: -20vmax; background: #2ee4ff; }
.intro-aurora i:nth-child(2) { width: 56vmax; height: 56vmax; right: -24vmax; bottom: -22vmax; background: #4f7bff; animation-delay: -6s; }
.intro-aurora i:nth-child(3) { width: 30vmax; height: 30vmax; left: 32%; top: 58%; background: #9cf4ff; opacity: 0.22; animation-delay: -11s; }
@keyframes drift {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to { transform: translate3d(4vmax, 3vmax, 0) scale(1.08); }
}
.intro-grid {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(180, 230, 255, 0.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(180, 230, 255, 0.09) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse at center, #000 28%, transparent 74%);
  mask-image: radial-gradient(ellipse at center, #000 28%, transparent 74%);
  animation: gridMove 30s linear infinite;
}
@keyframes gridMove { to { background-position: 44px 44px; } }

.intro-stars { position: absolute; inset: 0; pointer-events: none; }
.intro-stars span {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #c4f6ff;
  box-shadow: 0 0 12px #81ecff;
  opacity: 0.7;
  animation: starPulse 4.5s ease-in-out infinite;
}
.intro-stars span:nth-child(1) { top: 16%; left: 18%; }
.intro-stars span:nth-child(2) { top: 24%; left: 78%; animation-delay: -1.2s; }
.intro-stars span:nth-child(3) { top: 48%; left: 10%; animation-delay: -2s; }
.intro-stars span:nth-child(4) { top: 38%; right: 14%; animation-delay: -0.8s; }
.intro-stars span:nth-child(5) { top: 12%; right: 32%; width: 3px; height: 3px; }
.intro-stars span:nth-child(6) { top: 62%; left: 28%; animation-delay: -1.6s; }
.intro-stars span:nth-child(7) { top: 74%; right: 22%; width: 3px; height: 3px; animation-delay: -3s; }
.intro-stars span:nth-child(8) { top: 84%; left: 40%; animation-delay: -0.4s; }
@keyframes starPulse {
  0%, 100% { transform: scale(0.7); opacity: 0.3; }
  50% { transform: scale(1.3); opacity: 1; }
}

.intro-inner {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  max-width: 440px;
  width: 100%;
  pointer-events: none;
}

/* Logo: cincin cahaya berputar + logo dalam lingkaran putih */
.intro-logo-wrap {
  position: relative;
  width: clamp(132px, 36vw, 178px);
  height: clamp(132px, 36vw, 178px);
  margin-bottom: 26px;
  animation: logoFloat 4s ease-in-out infinite, fadeUp 0.9s var(--ease) 0.1s both;
}
.intro-logo-wrap::before {
  content: "";
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, #2ee4ff, rgba(255, 255, 255, 0.15), #2f6bff, #2ee4ff);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
  animation: spin 7s linear infinite;
}
.intro-logo-wrap::after {
  content: "";
  position: absolute;
  inset: -26px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(46, 228, 255, 0.35), transparent 65%);
  animation: glowPulse 3.2s ease-in-out infinite;
  pointer-events: none;
}
.intro-logo {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: #fff;
  border: 5px solid rgba(255, 255, 255, 0.95);
  box-shadow: 0 18px 48px rgba(0, 20, 60, 0.35), 0 0 42px rgba(46, 228, 255, 0.35);
  overflow: hidden;
}
.intro-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes glowPulse {
  0%, 100% { opacity: 0.55; transform: scale(0.96); }
  50% { opacity: 1; transform: scale(1.06); }
}
@keyframes logoFloat {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -8px; }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: none; }
}

.intro-kicker {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.26em;
  color: rgba(210, 245, 255, 0.92);
  margin-bottom: 10px;
  animation: fadeUp 0.9s var(--ease) 0.25s both;
}
.intro-heading {
  margin: 0;
  font-size: clamp(38px, 11.5vw, 56px);
  line-height: 1.04;
  font-weight: 900;
  letter-spacing: -0.035em;
  text-shadow: 0 6px 30px rgba(0, 25, 70, 0.35);
}
.intro-heading .w {
  display: inline-block;
  opacity: 0;
  transform: translateY(28px);
  animation: wordIn 0.95s var(--ease) both;
}
.intro-heading .w1 { animation-delay: 0.4s; }
.intro-heading .w2 { animation-delay: 0.55s; }
@keyframes wordIn {
  from { opacity: 0; transform: translateY(28px); filter: blur(4px); }
  to { opacity: 1; transform: none; filter: none; }
}
.intro-heading .world {
  display: block;
  margin-top: 4px;
  font-size: 0.7em;
  letter-spacing: 0.16em;
  font-weight: 800;
  background: linear-gradient(100deg, #8ee9ff 0%, #ffffff 42%, #8ee9ff 62%);
  background-size: 220% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  opacity: 0;
  animation: wordIn 0.95s var(--ease) 0.75s both, shimmer 4s linear 1.7s infinite;
}
@keyframes shimmer { to { background-position: -220% center; } }

.intro-sub {
  margin: 16px 0 8px;
  font-size: 15px;
  font-weight: 600;
  color: rgba(230, 248, 255, 0.94);
  animation: fadeUp 0.9s var(--ease) 1s both;
}
.intro-author {
  font-size: 13px;
  color: rgba(200, 235, 255, 0.85);
  margin-bottom: 30px;
  animation: fadeUp 0.9s var(--ease) 1.15s both;
}
.intro-hint {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  border-radius: 999px;
  border: 1px solid rgba(180, 230, 255, 0.4);
  background: rgba(255, 255, 255, 0.12);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #eefaff;
  animation: fadeUp 0.9s var(--ease) 1.3s both, hintPulse 2.4s ease-in-out 2.2s infinite;
}
.intro-hint .arrow { display: inline-block; font-size: 14px; animation: bob 1.6s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
@keyframes hintPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(110, 230, 255, 0); }
  50% { box-shadow: 0 0 24px 2px rgba(110, 230, 255, 0.3); }
}

/* Ripple saat ditekan */
.intro-ripple {
  position: absolute;
  width: 22px;
  height: 22px;
  margin: -11px 0 0 -11px;
  border-radius: 50%;
  border: 2px solid rgba(190, 245, 255, 0.95);
  background: radial-gradient(circle, rgba(255, 255, 255, 0.35), transparent 70%);
  pointer-events: none;
  animation: ripple 0.95s ease-out forwards;
}
@keyframes ripple {
  to { transform: scale(24); opacity: 0; }
}

.intro-caption {
  position: absolute;
  bottom: calc(18px + var(--safe-b));
  left: 0;
  right: 0;
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: rgba(180, 220, 255, 0.6);
  pointer-events: none;
  animation: fadeUp 1s var(--ease) 1.5s both;
}

/* ================= APP (halaman utama panjang) ================= */
#app {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.6s ease 0.1s, visibility 0.6s ease 0.1s;
}
#app.is-ready { opacity: 1; visibility: visible; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(12px + var(--safe-t)) 18px 12px;
  color: #fff;
  background: rgba(8, 40, 90, 0.5);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 800;
  text-shadow: 0 1px 8px rgba(0, 30, 70, 0.35);
}
.brand-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan);
}
.topbar-school {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  opacity: 0.9;
  text-align: right;
}
.progress {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--cyan), #fff);
  transform-origin: 0 50%;
  transform: scaleX(0);
}

main { display: block; }

/* ---------- Beranda (versi 5: tanpa kartu, berupa panggung digital) ---------- */
@keyframes riseIn {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: none; }
}
@keyframes orbitSpin { to { transform: rotate(360deg); } }
@keyframes corePulse {
  0%, 100% { box-shadow: 0 0 26px rgba(46, 212, 255, 0.45); }
  50% { box-shadow: 0 0 46px rgba(46, 212, 255, 0.85); }
}

.hero {
  min-height: calc(100vh - 64px);
  min-height: calc(100dvh - 64px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 26px 18px 60px;
}
.hero-stage {
  position: relative;
  isolation: isolate;
  width: min(100%, 760px);
  text-align: center;
  padding: 10px 0;
}
.hero-stage::before {
  content: "";
  position: absolute;
  inset: -10% -8%;
  z-index: -1;
  background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.6) 42%, rgba(255, 255, 255, 0) 72%);
  pointer-events: none;
}

/* Cincin orbit dengan teks melingkar dan inti berdenyut */
.hero-orbit {
  position: relative;
  width: clamp(168px, 44vw, 212px);
  height: clamp(168px, 44vw, 212px);
  margin: 0 auto 6px;
  animation: riseIn 0.9s var(--ease) both;
}
.hero-orbit .ring-dash {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1.5px dashed rgba(47, 107, 255, 0.35);
}
.hero-orbit svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  animation: orbitSpin 24s linear infinite;
  overflow: visible;
}
.hero-orbit text {
  font-size: 11.5px;
  font-weight: 900;
  fill: var(--blue);
  letter-spacing: 0.04em;
}
.orbit-core {
  position: absolute;
  inset: 22%;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, var(--blue), var(--cyan));
  color: #fff;
  overflow: hidden;
  padding: 0;
  background: #fff;
  border: 3px solid rgba(255, 255, 255, 0.95);
  animation: corePulse 3s ease-in-out infinite;
}
.orbit-core img { width: 100%; height: 100%; object-fit: contain; display: block; }

.hero-kicker {
  display: inline-block;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.24em;
  color: var(--blue);
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid rgba(47, 107, 255, 0.18);
  padding: 8px 16px;
  border-radius: 999px;
  box-shadow: 0 6px 18px rgba(18, 55, 110, 0.08);
  animation: riseIn 0.8s var(--ease) 0.15s both;
}
.hero-title {
  margin: 18px 0 10px;
  font-size: clamp(46px, 12.5vw, 100px);
  line-height: 0.98;
  font-weight: 900;
  letter-spacing: -0.05em;
  color: var(--ink);
  overflow-wrap: break-word;
}
.hero-title .line { display: block; animation: riseIn 0.95s var(--ease) both; }
.hero-title .line:nth-child(1) { animation-delay: 0.25s; }
.hero-title .line:nth-child(2) { animation-delay: 0.4s; }
.hero-title .accent {
  background: linear-gradient(100deg, var(--blue) 0%, var(--cyan) 50%, var(--blue) 100%);
  background-size: 220% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: riseIn 0.95s var(--ease) 0.4s both, shimmer 5s linear 1.4s infinite;
}
.hero-tag {
  margin: 0 0 8px;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.06em;
  color: var(--blue);
  animation: riseIn 0.9s var(--ease) 0.55s both;
}
.hero-school {
  margin: 0 0 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  animation: riseIn 0.9s var(--ease) 0.62s both;
}
.hero-desc {
  margin: 0 auto;
  max-width: 540px;
  font-size: 14.5px;
  line-height: 1.7;
  color: var(--muted);
  animation: riseIn 0.9s var(--ease) 0.7s both;
}

.hero-stats {
  list-style: none;
  margin: 24px 0 22px;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  animation: riseIn 0.9s var(--ease) 0.8s both;
}
.hero-stats li {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 16px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(47, 107, 255, 0.14);
  box-shadow: 0 8px 20px rgba(18, 55, 110, 0.1);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
}
.hero-stats b {
  font-size: 22px;
  font-weight: 900;
  line-height: 1;
  color: var(--blue);
}

.toc {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 26px;
  animation: riseIn 0.9s var(--ease) 0.9s both;
}
.toc a {
  display: inline-flex;
  align-items: center;
  min-height: 40px;
  padding: 9px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 800;
  text-decoration: none;
  color: var(--blue);
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid rgba(47, 107, 255, 0.16);
  transition: background 0.25s ease, color 0.25s ease, transform 0.25s var(--ease);
}
.toc a:hover { background: var(--blue); color: #fff; }
.toc a:active { transform: scale(0.97); }

/* ---------- Bagian konten ---------- */
.section {
  width: 100%;
  max-width: 880px;
  margin: 0 auto;
  padding: 40px 16px 0;
  scroll-margin-top: 70px;
}
.panel {
  position: relative;
  padding: clamp(22px, 4.5vw, 36px);
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid rgba(255, 255, 255, 0.75);
  box-shadow: var(--shadow-soft);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--blue);
  background: rgba(47, 107, 255, 0.1);
  padding: 7px 12px;
  border-radius: 999px;
  margin-bottom: 12px;
}
.eyebrow::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--blue);
}
h2 {
  margin: 0 0 12px;
  font-size: clamp(26px, 6.5vw, 36px);
  font-weight: 900;
  letter-spacing: -0.03em;
  line-height: 1.15;
  color: var(--ink);
}
.grad {
  background: linear-gradient(110deg, var(--blue), var(--cyan));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.lead {
  margin: 0 0 18px;
  font-size: 14.5px;
  line-height: 1.7;
  color: var(--muted);
}

/* Profil */
.profile-grid {
  display: grid;
  grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
  gap: 22px;
  align-items: center;
}
.profile-photo {
  margin: 0 auto;
  width: 100%;
  max-width: 250px;
}
.profile-photo img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  border-radius: 22px;
  border: 3px solid #fff;
  box-shadow: 0 0 0 1px rgba(47, 107, 255, 0.12), 0 14px 30px rgba(12, 47, 86, 0.2);
  background: #e8f2ff;
}
.info-list { margin: 0; display: grid; gap: 10px; }
.info-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.86);
  border: 1px solid rgba(47, 107, 255, 0.14);
  box-shadow: 0 4px 12px rgba(15, 54, 96, 0.07);
  min-width: 0;
}
.info-icon {
  flex: 0 0 36px;
  height: 36px;
  border-radius: 12px;
  display: grid;
  place-items: center;
